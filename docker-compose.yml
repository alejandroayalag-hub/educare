services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: gokids-postgres
    environment:
      POSTGRES_DB: gokids
      POSTGRES_USER: gokids_user
      POSTGRES_PASSWORD: gokids_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
