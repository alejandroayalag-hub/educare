services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: educare-postgres
    environment:
      POSTGRES_DB: educare
      POSTGRES_USER: educare_user
      POSTGRES_PASSWORD: educare_pass
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
